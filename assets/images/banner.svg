<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030B" />
      <stop offset="50%" stop-color="#110B24" />
      <stop offset="100%" stop-color="#030208" />
    </linearGradient>
    <linearGradient id="uv-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="q-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05030B" stop-opacity="0" />
    </radialGradient>
    <pattern id="q-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#q-bg)" />
  <rect width="1200" height="420" fill="url(#q-glow)" />
  <rect width="1200" height="420" fill="url(#q-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.2" />

  <!-- Quantum Entanglement / Bloch Sphere Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Entanglement Wave Spiral Linking Qubits -->
    <path d="M -110 0 C -60 -70 60 70 110 0" fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.8" />
    <path d="M -110 0 C -60 70 60 -70 110 0" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.8" />

    <!-- Alice Qubit Sphere (Left) -->
    <g transform="translate(-110, 0)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.6" />
      <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.7" />
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.4" />
      <line x1="0" y1="0" x2="28" y2="-32" stroke="#A855F7" stroke-width="2.5" />
      <circle cx="28" cy="-32" r="5" fill="#FFFFFF" />
      <text x="0" y="72" fill="#C084FC" font-family="'SF Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">|ψ⟩ ALICE</text>
    </g>

    <!-- Bob Qubit Sphere (Right) -->
    <g transform="translate(110, 0)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.6" />
      <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.7" />
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />
      <line x1="0" y1="0" x2="28" y2="-32" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="28" cy="-32" r="5" fill="#FFFFFF" />
      <text x="0" y="72" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">|ψ⟩ BOB</text>
    </g>

    <!-- Bell State Entangled Pair Node -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="18" fill="#1C1038" stroke="#EC4899" stroke-width="2" />
      <text x="0" y="4" fill="#EC4899" font-family="'SF Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">|Φ+⟩</text>
    </g>

    <text x="0" y="125" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">BELL STATE: TELEPORTATION CIRCUIT</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="240" height="30" rx="15" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#7C3AED" />
    <text x="28" y="19" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">QUANTUM TELEPORTATION</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      EntangleMe
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#uv-cyan)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Quantum teleportation messaging app simulating qubit transfer with Qiskit.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Simulates Bell state preparation, non-local measurement, and classical correction channels.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SIMULATION: IBM QISKIT</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">STACK: FASTAPI + REACT</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>